groups:
  - name: worthproof-api
    rules:
      - alert: WorthProofApiHighErrorRate
        expr: sum(rate(worthproof_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(worthproof_http_requests_total[5m])), 0.001) > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "WorthProof API 5xx rate is above 5%"
      - alert: WorthProofApiP95LatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(worthproof_http_request_duration_seconds_bucket{route=~"/api/.*"}[10m]))) > 2.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "WorthProof API P95 latency is above 2.5 seconds"
      - alert: WorthProofDependencyUnavailable
        expr: worthproof_dependency_up == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "WorthProof dependency {{ $labels.dependency }} is unavailable"
      - alert: WorthProofDeadLetterQueueNotEmpty
        expr: worthproof_queue_messages{state="dead"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "WorthProof monitor dead-letter queue contains messages"
      - alert: WorthProofMonitorQueueBacklog
        expr: worthproof_queue_messages{state=~"ready|retry"} > 1000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "WorthProof monitor queue backlog exceeds 1000 messages"
